<?xml version="1.0" encoding="UTF-8"?>
<!-- Moonglow Toolset's icon: a crescent moon over a night sky. GPL-3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4a"/>
      <stop offset="1" stop-color="#3a2a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#bfd4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfd4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdcff"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="248" cy="250" r="150" fill="white"/>
      <circle cx="318" cy="200" r="132" fill="black"/>
    </mask>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <circle cx="248" cy="250" r="230" fill="url(#glow)"/>
    <g fill="#e8eeff">
      <circle cx="392" cy="352" r="7"/>
      <circle cx="420" cy="118" r="5"/>
      <circle cx="104" cy="112" r="4"/>
      <circle cx="356" cy="430" r="4"/>
      <circle cx="122" cy="420" r="5"/>
      <path d="M396 236 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8 l22 -8 z"/>
    </g>
    <rect width="512" height="512" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
</svg>
