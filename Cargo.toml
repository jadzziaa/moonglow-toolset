[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
# Moonglow crates
mg-2da = { path = "crates/mg-2da" }
mg-core = { path = "crates/mg-core" }
mg-gff = { path = "crates/mg-gff" }
mg-image = { path = "crates/mg-image" }
mg-edit = { path = "crates/mg-edit" }
mg-erf = { path = "crates/mg-erf" }
mg-key = { path = "crates/mg-key" }
mg-mdl = { path = "crates/mg-mdl" }
mg-module = { path = "crates/mg-module" }
mg-render = { path = "crates/mg-render" }
mg-resman = { path = "crates/mg-resman" }
mg-rules = { path = "crates/mg-rules" }
mg-schema = { path = "crates/mg-schema" }
mg-script = { path = "crates/mg-script" }
mg-set = { path = "crates/mg-set" }
mg-ssf = { path = "crates/mg-ssf" }
mg-testkit = { path = "crates/mg-testkit" }
mg-tiles = { path = "crates/mg-tiles" }
mg-tlk = { path = "crates/mg-tlk" }
mg-ui = { path = "crates/mg-ui" }

# Third party
anyhow = "1"
base64 = "0.23"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = "0.21"
egui_kittest = "0.36"
encoding_rs = "0.8"
fastrand = "2"
glam = { version = "0.30", features = ["bytemuck"] }
indexmap = "2"
memmap2 = "0.9"
png = "0.18"
pollster = "0.4"
proptest = "1"
rayon = "1"
rfd = "0.17"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
wgpu = "30"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
