[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
# The release: the version of the two programs (apps/mg, apps/moonglow),
# the one line a release changes (packaging/README.md). The libraries
# keep "0.0.0", so that a release rebuilds the programs alone; what they
# say of the release they read from the program (mg_core::release).
version = "2.11.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
# Moonglow crates
mg-2da = { path = "crates/mg-2da" }
mg-area = { path = "crates/mg-area" }
mg-audio = { path = "crates/mg-audio" }
mg-core = { path = "crates/mg-core" }
mg-gff = { path = "crates/mg-gff" }
mg-image = { path = "crates/mg-image" }
mg-edit = { path = "crates/mg-edit" }
mg-erf = { path = "crates/mg-erf" }
mg-key = { path = "crates/mg-key" }
mg-mdl = { path = "crates/mg-mdl" }
mg-module = { path = "crates/mg-module" }
mg-nui = { path = "crates/mg-nui" }
mg-plugin = { path = "crates/mg-plugin" }
# (Without the renderer by default, so that `mg` can leave it out: mg-area and
# mg-ui ask for it.)
mg-preview = { path = "crates/mg-preview", default-features = false }
mg-render = { path = "crates/mg-render" }
mg-resman = { path = "crates/mg-resman" }
mg-rules = { path = "crates/mg-rules" }
mg-schema = { path = "crates/mg-schema" }
mg-script = { path = "crates/mg-script" }
mg-serve = { path = "crates/mg-serve" }
mg-shader = { path = "crates/mg-shader" }
mg-set = { path = "crates/mg-set" }
mg-ssf = { path = "crates/mg-ssf" }
mg-testkit = { path = "crates/mg-testkit" }
mg-tiles = { path = "crates/mg-tiles" }
mg-tlk = { path = "crates/mg-tlk" }
mg-ui = { path = "crates/mg-ui" }

# Third party
anyhow = "1"
base64 = "0.23"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "wgpu", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }
egui_dock = "0.21"
egui_kittest = "0.36"
encoding_rs = "0.8"
fastrand = "2"
# (glslang's C++ built from the sources the crate ships, with cc: no
# CMake, Python or network, which the Flatpak's offline build needs.)
glslang = "0.9"
glam = { version = "0.30", features = ["bytemuck"] }
# (The NUI preview's JPEG and BMP pictures, which nothing else here reads.)
image = { version = "0.25", default-features = false, features = ["jpeg", "bmp"] }
indexmap = "2"
# (The local time of day the script editor's compiler messages show: the
# system's time zone, which std cannot read.)
jiff = "0.2"
memmap2 = "0.9"
# (The version wgpu uses: its modules go to wgpu as they are.)
naga = { version = "30", features = ["spv-in"] }
mlua = { version = "0.12", features = ["luau", "serde"] }
png = "0.18"
pollster = "0.4"
proptest = "1"
rayon = "1"
rfd = "0.17"
regex-lite = "0.1"
# (eframe's settings file, read before the window opens: the version
# eframe writes it with.)
ron = "0.12"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# (A font's metrics for the NUI preview. epaint reads fonts with it too:
# the version follows egui's.)
skrifa = "0.44"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
symphonia = { version = "0.6", default-features = false, features = ["adpcm", "mp3", "pcm", "wav"] }
thiserror = "2"
# (The GUI's check for a new release: one HTTPS request to GitHub, on a
# thread. rustls with ring and webpki-roots' certificates, built in, so
# that the AppImage and the Windows and macOS builds need nothing of the
# system's; no gzip, no proxies of the registry. The CLI doesn't link it.)
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml = "1"
# (Writing the project file's plugin tables in place, the rest of it as written.)
toml_edit = "0.25"
# (`naga-ir`: the game's shaders reach wgpu as naga modules, mg-shader's.)
wgpu = { version = "30", features = ["naga-ir"] }
# (Reading a plugin's archive: flate2 with zlib-rs is built in already.)
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# Line tables (backtraces with file and line), not full debug information:
# with it each test binary is over 600 MB, and target/ grew to 900 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# The packages' build (packaging/): smaller and a little faster than
# release. Function names stay, for crash reports' backtraces.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
