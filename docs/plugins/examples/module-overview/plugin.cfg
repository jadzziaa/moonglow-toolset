; A panel (API 0.6): what the module has, and what is selected.
[plugin]
id = "example.module-overview"
name = "Module overview"
version = "1.0.0"
api = "0.6"
license = "GPL-3.0-or-later"
description = "A pane that shows how many areas, creatures and scripts the module has, its areas to open, and the tags of what is selected, with a button that upper-cases those that are not."
author = "Moonglow Toolset"

[panel]
id = "overview"
title = "Module Overview"
hint = "What the module has, and what is selected"
refresh = "edits, selection"

[command]
id = "upper-tags"
title = "Upper-Case Selected Tags"
hint = "The tag of each blueprint or object selected, in upper case"
