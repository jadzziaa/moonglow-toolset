# The plugin's own tests: `mg plugin test docs/plugins/examples/module-overview`.
# A panel's test says what it shows (`shows`: each part of one of its
# texts), with what is selected (`select`).
module = "module"

[[test]]
name = "what the module has, with nothing selected"
panel = "overview"
shows = ["Areas: 1", "Creature blueprints: 2", "Scripts: 0", "The Tavern", "Nothing is selected."]

[[test]]
name = "what is selected, and the button for the tags that are not upper case"
panel = "overview"
select = ["guard.utc", "captain.utc"]
shows = ["creature: gate_guard", "creature: CAPTAIN", "1 of them not upper case", "Upper-Case Their Tags"]

[[test]]
name = "the button's command upper-cases them, in one step"
command = "upper-tags"
select = ["guard.utc", "captain.utc"]
edits = 1
log = ["1 tags upper-cased"]
[[test.field]]
resource = "guard.utc"
field = "Tag"
value = "GATE_GUARD"
