; Outside the module: a folder the user chooses is read, its files go
; into a hak, and an area is made with a group of the tileset placed.
[plugin]
id = "example.tileset-import"
name = "Tileset import"
version = "1.0.0"
api = "0.2"
license = "GPL-3.0-or-later"
description = "Puts a folder of tileset files (as NWN Mapper exports them: models, walkmeshes, textures, materials and a .set) into a hak, adds the hak to the module, and makes an area with one of the tileset's groups placed in it."
author = "Moonglow Toolset"

[command]
id = "import"
title = "Import Tileset Folder…"
hint = "A folder of tileset files into a hak, and an area of one of its groups"
