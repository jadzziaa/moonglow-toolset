; A batch edit with a form: every store's prices at once.
[plugin]
id = "example.store-markup"
name = "Store markup"
version = "1.0.0"
api = "0.1"
license = "GPL-3.0-or-later"
description = "Sets what every store sells for and buys at, as percentages of an item's value."
author = "Moonglow Toolset"

[command]
id = "set-markup"
title = "Set Store Markup…"
hint = "The Mark Up and Mark Down of every store blueprint"
