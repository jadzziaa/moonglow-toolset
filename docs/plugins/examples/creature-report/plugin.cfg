; Reading the game's data: 2DA rows and talk-table strings.
[plugin]
id = "example.creature-report"
name = "Creature report"
version = "1.0.0"
api = "0.1"
license = "GPL-3.0-or-later"
description = "Lists the module's creature blueprints with their classes and levels in the log."
author = "Moonglow Toolset"

[command]
id = "list-classes"
title = "List Creature Classes"
hint = "Each creature blueprint's classes and levels, in the log"
