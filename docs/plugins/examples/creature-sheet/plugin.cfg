; Creatures to a spreadsheet and back: exporters and an importer (API 0.6).
[plugin]
id = "example.creature-sheet"
name = "Creature sheet"
version = "1.0.0"
api = "0.6"
license = "GPL-3.0-or-later"
description = "Writes the module's creature blueprints, or those selected, to a CSV file, and reads such a file back into the module, setting each creature's tag and name."
author = "Moonglow Toolset"

[exporter]
id = "creatures-csv"
title = "Creatures as CSV…"
hint = "Each creature blueprint's resref, tag, name and level, a row each"
extension = "csv"

[exporter]
id = "selected-csv"
title = "Selected Creatures as CSV…"
hint = "The creature blueprints selected, a row each"
extension = "csv"
for = "creature blueprint"

[importer]
id = "creatures-csv"
title = "Creatures from CSV…"
hint = "Each row's tag and name set on the creature blueprint of its resref"
extensions = "csv"
