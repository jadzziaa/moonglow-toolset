; Commands in the right-click menus of objects and areas, run on what was
; clicked (plugin API 0.4).
[plugin]
id = "example.set-local"
name = "Set local"
version = "1.0.0"
api = "0.4"
license = "GPL-3.0-or-later"
description = "Sets a local variable on the objects or blueprints right-clicked, and counts what an area holds: commands that act on the selection."
author = "Moonglow Toolset"

[command]
id = "set-local"
title = "Set Local Variable…"
hint = "A local variable on each object selected, placed or a blueprint"
for = "creature, door, encounter, item, placeable, sound, store, trigger, waypoint"

[command]
id = "count-objects"
title = "Count Objects"
hint = "How many objects of each kind the area holds"
for = "area"
