; A team's house rules, kept while builders work (API 0.4): what a save
; would write is read first (an area's tag is kept once the team says so,
; and is upper case), a pasted waypoint gets a tag of its own, and a new
; area gets the team's land variable. Each acts by itself, on an event.
[plugin]
id = "example.house-rules"
name = "House rules"
version = "1.0.0"
api = "0.4"
license = "GPL-3.0-or-later"
description = "A team's rules, kept as builders work: a save that changes an area's tag is refused (players' places are kept by it), one that is not upper case is warned of with a fix; a pasted waypoint gets a tag of its own; a new area gets the team's land variable."
author = "Moonglow Toolset"

[event]
id = "area-tags"
on = "resource-saving"
types = "are"

[event]
id = "pasted-waypoints"
on = "object-pasted"
for = "waypoint"

[event]
id = "new-area"
on = "resource-created"
for = "area"

[setting]
id = "keep_tags"
type = "bool"
default = true
label = "Keep area tags"
help = "A save that changes an area's tag is refused (else it is only warned of)"
scope = "project"

[setting]
id = "land"
label = "Land of new areas"
help = "The value of the variable land on each new area (none: not set)"
scope = "project"
