; A wizard (API 0.6): a store blueprint made page by page.
[plugin]
id = "example.store-wizard"
name = "Store wizard"
version = "1.0.0"
api = "0.6"
license = "GPL-3.0-or-later"
description = "Makes a store blueprint page by page: its name and kind, its prices (which the kind suggests), and, for a smith or an alchemist, whether it buys only what it sells."
author = "Moonglow Toolset"

[wizard]
id = "new-store"
title = "Shop Wizard…"
hint = "A store blueprint: its name, its prices and what it buys"
