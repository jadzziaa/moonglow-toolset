; A color picked from a right-click menu, shown on the placeables while it
; is picked (plugin API 0.8's color field).
[plugin]
id = "example.pick-tint"
name = "Pick tint"
version = "1.0.0"
api = "0.8"
license = "GPL-3.0-or-later"
description = "Picks the tint of the placeables right-clicked (The Domains of Dread's tdod_tint), drawn on them while it is picked, and sets it: a form's color field."
author = "Moonglow Toolset"

[command]
id = "pick-tint"
title = "Tint…"
hint = "The color the placeables right-clicked are tinted with"
for = "placed placeable"
