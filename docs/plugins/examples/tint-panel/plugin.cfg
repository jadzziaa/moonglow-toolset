; A tint picked in a panel that stays open and follows the selection
; (plugin API 0.9's panel fields), not in a form that closes on OK.
[plugin]
id = "example.tint-panel"
name = "Tint panel"
version = "1.0.0"
api = "0.9"
license = "GPL-3.0-or-later"
description = "A pane that shows the tint of the placed placeables selected (The Domains of Dread's tdod_tint) in a color field, drawn on them while it is picked and set when the picker closes, and a choice of named tints, each with its swatch."
author = "Moonglow Toolset"

[panel]
id = "tint"
title = "Tint"
hint = "The tint of the placed placeables selected"
refresh = "edits, selection"

[command]
id = "set-tint"
title = "Set Tint"
hint = "The placeables selected tinted with the Tint panel's color"

[command]
id = "set-preset"
title = "Set Named Tint"
hint = "The placeables selected tinted with the Tint panel's named tint"
