# The fixture of the plugin's tests: a nasher project, its resources as
# JSON in src/. The tavern has three placeables: a rug tinted night blue,
# a crate tinted crimson (tdod_tint) and a barrel not tinted.
[package]
name = "Tint panel fixture"

[package.sources]
include = "src/**/*.json"

[target]
name = "default"
file = "fixture.mod"
