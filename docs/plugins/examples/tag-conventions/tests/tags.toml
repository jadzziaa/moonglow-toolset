# The plugin's own tests: `mg plugin test docs/plugins/examples/tag-conventions`.
# Each [[test]] runs a check, a command or an event on the fixture module
# (a nasher project beside this file) and says what is to come of it.
module = "module"

[[test]]
name = "a lower-case tag is found, with its fix"
check = "tag-case"
[[test.finding]]
resource = "guard.utc"
at = "Tag"
message = 'tag "gate_guard" is not upper case'
severity = "warning"
fix = "Upper-case this tag"

[[test]]
name = "the fix upper-cases that tag, and the check finds no more"
check = "tag-case"
fix = "Upper-case this tag"
edits = 1
left = 0
[[test.field]]
resource = "guard.utc"
field = "Tag"
value = "GATE_GUARD"

[[test]]
name = "the command upper-cases every tag, in one step"
command = "fix-tags"
log = ["1 creature tags changed"]
resources = ["guard.utc"]
[[test.field]]
resource = "guard.utc"
field = "Tag"
value = "GATE_GUARD"
[[test.field]]
resource = "captain.utc"
field = "Tag"
value = "CAPTAIN"
