; A team's rule for creature tags, as a check and a command that applies it.
[plugin]
id = "example.tag-conventions"
name = "Tag conventions"
version = "1.0.0"
api = "0.1"
license = "GPL-3.0-or-later"
description = "Creature tags are upper case: a check for Verify Module, and a command that fixes them."
author = "Moonglow Toolset"

[command]
id = "fix-tags"
title = "Fix Creature Tags"
hint = "Upper-case every creature blueprint's tag"

[check]
id = "tag-case"
title = "Creature tags are upper case"
