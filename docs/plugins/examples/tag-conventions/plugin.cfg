; A team's rule for creature tags, as a check (with a fix for each tag) and a
; command that applies it, with tests of its own in tests/
[plugin]
id = "example.tag-conventions"
name = "Tag conventions"
version = "1.1.0"
api = "0.4"
license = "GPL-3.0-or-later"
description = "Creature tags are upper case: a check for Verify Module with a fix for each tag, a command that fixes them all, and tests of its own."
author = "Moonglow Toolset"

[command]
id = "fix-tags"
title = "Fix Creature Tags"
hint = "Upper-case every creature blueprint's tag"

[check]
id = "tag-case"
title = "Creature tags are upper case"
