; A team's tag prefix and each builder's code, kept as settings (API 0.4):
; the team's in the project's moonglow.toml, the builder's in their own
; .moonglow/user.toml, and one of the user's own for every module. A
; check holds the module's tags to them, with a fix for each; a command
; remembers the builder's code, and one prefixes what is selected.
[plugin]
id = "example.builder-tags"
name = "Builder tags"
version = "1.0.0"
api = "0.4"
license = "GPL-3.0-or-later"
description = "The tags of the module's creatures and placeables begin with the team's prefix: a check with a fix for each, a command that remembers your builder code and one that prefixes what is selected, and settings for all three."
author = "Moonglow Toolset"

[command]
id = "remember-code"
title = "Set My Builder Code…"
hint = "Keep your builder code for this project (your own, not the team's)"

[command]
id = "prefix-tags"
title = "Prefix Tags"
hint = "Begin the tags of what is selected with the team's prefix and your code"
for = "creature, placeable"

[check]
id = "tag-prefix"
title = "Tags begin with the team's prefix"

[setting]
id = "prefix"
label = "Team prefix"
help = "What the tag of each of the module's own creatures and placeables begins with (none: not checked)"
scope = "project"

[setting]
id = "kinds"
type = "choice"
label = "Checked"
help = "Which blueprints the check holds to the prefix"
choices = "creatures and placeables, creatures, placeables"
scope = "project"

[setting]
id = "max_length"
type = "int"
label = "Longest tag"
help = "A prefixed tag is cut to this many characters"
min = 1
max = 32
default = 32
scope = "project"

[setting]
id = "code"
label = "Your code"
help = "Your builder code, which comes after the team's prefix in the tags you make (yours alone, for this project)"
scope = "user-project"

[setting]
id = "strict"
type = "bool"
label = "Report as errors"
help = "A tag without the prefix is an error, not a warning (yours, in every module)"
