[package]
name = "mg-render"
description = "The wgpu renderer: models, textures and EE-style lighting, on screen or offscreen"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
glam.workspace = true
log = "0.4"
mg-core.workspace = true
mg-image.workspace = true
mg-mdl.workspace = true
mg-resman.workspace = true
mg-shader.workspace = true
naga.workspace = true
pollster.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
# (dxcompiler.dll beside the program loaded before wgpu is told to take it:
# `dx12.rs`.)
libloading = "0.8"

[dev-dependencies]
mg-testkit = { workspace = true, features = ["hlsl"] }
# (Moonglow's own shaders written for Metal in a test: what its backend
# refuses shows on every platform.)
naga = { workspace = true, features = ["wgsl-in", "msl-out"] }
png.workspace = true

[lints]
workspace = true
