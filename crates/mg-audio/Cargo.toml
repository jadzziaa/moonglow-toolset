[package]
name = "mg-audio"
description = "The game's sounds and music: what a file holds and where the game plays it, and (the feature decode) decoded: PCM and IMA ADPCM WAV, MP3 (BMU, bare, tagged or inside a WAV)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Decoding for playback (Symphonia): what a file holds, and the roles the game
# plays it in, need none of it.
default = ["decode"]
decode = ["dep:symphonia"]

[dependencies]
mg-core.workspace = true
symphonia = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true
