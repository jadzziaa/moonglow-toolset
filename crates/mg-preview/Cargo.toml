[package]
name = "mg-preview"
description = "Blueprint previews: creatures, items, placeables and doors assembled as the game shows them"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
mg-2da.workspace = true
mg-core.workspace = true
mg-gff.workspace = true
mg-image.workspace = true
mg-mdl.workspace = true
mg-module = { workspace = true, optional = true }
mg-render = { workspace = true, optional = true }
mg-resman.workspace = true
mg-rules.workspace = true
mg-set.workspace = true
mg-ssf = { workspace = true, optional = true }
thiserror.workspace = true

# The renderer's half, `compose`: the models turned into mg-render's
# instances (with wgpu). Without it, what a preview is made of and the
# files it loads, which `mg` reads with no GPU.
[features]
default = ["render"]
render = ["dep:mg-render"]
# What a module uses of its haks (`usage`): the walk from its resources,
# which reads modules (mg-module). `mg` and the window turn it on; the
# viewer, which draws previews only, leaves it off.
usage = ["dep:mg-module", "dep:mg-ssf"]

# (Previews drawn on the GPU.)
[[test]]
name = "previews"
required-features = ["render"]

[dev-dependencies]
mg-testkit.workspace = true
mg-tlk.workspace = true
png.workspace = true
wgpu.workspace = true

[lints]
workspace = true
