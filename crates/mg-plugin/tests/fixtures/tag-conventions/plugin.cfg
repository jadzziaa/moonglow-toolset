; The example of the plugin proposal: a team's tag rules.
[plugin]
id = "example.tag-conventions"
name = "Tag conventions"
version = "1.0.0"
api = "0.1"
license = "GPL-3.0-or-later"
description = "Checks creature tags against the server's rules, and fixes them."
author = "Moonglow Toolset"

[command]
id = "fix-tags"
title = "Fix Creature Tags"
hint = "Upper-case every creature's tag"

[command]
id = "promote"
title = "Promote the Guards"

[check]
id = "tag-case"
title = "Creature tags are upper case"
