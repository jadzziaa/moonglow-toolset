name: CI

# Not for documentation alone, but for the manual (built into the app); not
# for the Scoop manifest (bucket/, committed after each release: nothing
# built reads it); not for tags (their commit was tested on its branch).
on:
  push:
    branches: ["**"]
    paths: ["**", "!docs/**", "!**.md", "!bucket/**", "docs/manual/**"]
  pull_request:
    paths: ["**", "!docs/**", "!**.md", "!bucket/**", "docs/manual/**"]

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A commit that passed on one branch is not tested again on another: a
  # release is pushed to a tmp/ branch first and to develop once it passes.
  tested:
    name: Tested already?
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      already: ${{ steps.find.outputs.already }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq .total_count || echo 0)
          echo "runs of $SHA that passed: $passed"
          if [ "$passed" -gt 0 ]; then echo "already=true" >> "$GITHUB_OUTPUT"; fi

  # Format and clippy beside the tests, not before them: on Windows they
  # were two of its job's fifteen minutes. A job of their own also keeps
  # their check builds out of the tests' cache.
  lint:
    needs: tested
    if: needs.tested.outputs.already != 'true'
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        # ALSA for sound playback (rodio).
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (the tests run by hand)
        # `test = false` in their manifests: --all-targets leaves them out.
        run: |
          cargo clippy -p mg-ui --test screens --test frame_perf --test world_perf --test campaign_perf --test editor_perf --test nui_perf -- -D warnings
          cargo clippy -p mg-corpus-tests --test client_render --test client_minimap --test client_nui -- -D warnings
      - name: Clippy (mg and mg-preview without the GPU)
        # Their default features are on in everything above.
        run: cargo clippy -p mg -p mg-preview --no-default-features --all-targets -- -D warnings

  test:
    needs: tested
    if: needs.tested.outputs.already != 'true'
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests are built without debug information (Cargo.toml's
      # line tables): less to compile, link and cache, and the doc tests'
      # libraries are then the tests' own (on Linux the line tables made
      # them another build of the 26 libraries, two minutes). A failing
      # test still says its file and line; only a backtrace, which CI
      # doesn't print, would lose its lines.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # The image's .NET, Android, Haskell and CodeQL toolchains, unused
        # here: room for the tests' build. Removed in the background while
        # the toolchain and the cache are set up: on its own the removal
        # took 0.8 to 2.3 minutes, before the build needs the room.
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Saved by develop alone: other branches start from develop's (a
        # branch may read its default branch's caches). GitHub keeps 10 GB
        # per repository, and a branch's pushes (each change to a manifest
        # is a new key) evicted develop's, whose next runs started cold.
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        # ALSA for sound playback (rodio).
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: DXC beside the test binaries
        # The pinned dxcompiler.dll the Windows packages ship, where the
        # test binaries run (target\debug\deps): Direct3D 12 compiles
        # shaders with it there as beside moonglow.exe (mg_render::dx12).
        # MOONGLOW_REQUIRE_DXC, below, fails the compiler check in
        # mg-render's render tests unless Direct3D 12 took it.
        if: runner.os == 'Windows'
        run: packaging\windows\dxc.ps1 -Destination target\debug\deps
      - name: Test
        # Corpus, differential and engine tests skip without a game install.
        # Not the examples (developer tools; a plain `cargo test` links all
        # 22 of them; the Lint job's clippy checks them).
        env:
          MOONGLOW_REQUIRE_DXC: ${{ runner.os == 'Windows' && '1' || '' }}
        # --timings: when each crate and test binary was built, how long it
        # took and what waited on it (the build is most of the job).
        run: cargo test --workspace --lib --bins --tests --timings
      - name: Documentation tests
        run: cargo test --workspace --doc
      - name: Build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.os }}
          path: target/cargo-timings/cargo-timing.html
          retention-days: 14
          if-no-files-found: ignore
