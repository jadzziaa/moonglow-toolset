name: CI

# Not for documentation alone, but for the manual (built into the app); not
# for tags (their commit was tested on its branch).
on:
  push:
    branches: ["**"]
    paths: ["**", "!docs/**", "!**.md", "docs/manual/**"]
  pull_request:
    paths: ["**", "!docs/**", "!**.md", "docs/manual/**"]

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables, not full debug information: the test binaries otherwise
  # outgrow the runners' disks.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # The image's .NET, Android, Haskell and CodeQL toolchains, unused
        # here: room for the tests' build.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        # ALSA for sound playback (rodio).
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # Corpus, differential and engine tests skip without a game install.
        run: cargo test --workspace
