[package]
name = "mg"
description = "Moonglow's command-line tool: inspect and convert game files and resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

# One test binary (tests/groups/cli.rs, each test file a module of it): a
# binary per file was 23 links for 34 tests, run one binary at a time.
[[test]]
name = "cli"
path = "tests/groups/cli.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mg-2da.workspace = true
mg-core.workspace = true
mg-edit.workspace = true
mg-erf.workspace = true
mg-gff.workspace = true
mg-mdl.workspace = true
mg-module.workspace = true
mg-nui.workspace = true
mg-plugin.workspace = true
mg-preview.workspace = true
mg-render = { workspace = true, optional = true }
mg-resman.workspace = true
mg-serve.workspace = true
mg-set.workspace = true
mg-ssf.workspace = true
mg-rules.workspace = true
mg-schema.workspace = true
mg-script.workspace = true
mg-tlk.workspace = true
mg-ui = { workspace = true, optional = true }
serde_json.workspace = true
toml.workspace = true
zip.workspace = true

# `mg nui render` and `mg nui layout`: the NUI Creator's preview, drawn
# on the GPU by the GUI's library (mg-ui, egui and wgpu). On by default,
# so the packages' `mg` has every command; `--no-default-features` builds
# `mg` without them, and without the GPU stack.
[features]
default = ["nui-preview"]
nui-preview = ["dep:mg-ui", "dep:mg-render"]

[dev-dependencies]
mg-testkit.workspace = true

[lints]
workspace = true
